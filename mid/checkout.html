<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Etsy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body class="site-bg">

<header>
    <nav class="navbar navbar-expand-lg px-3 px-lg-4 pt-3 pb-3 border-bottom border-secondary-subtle">
        <div class="container-fluid">
            <a class="navbar-brand logo mb-0" href="index.html">Etsy</a>
            <a href="index.html" class="btn btn-outline-dark rounded-pill px-3 fw-semibold text-decoration-none">
                <i class="bi bi-arrow-left"></i> Back to Shop
            </a>
        </div>
    </nav>
</header>

<main class="container my-5" style="max-width: 900px;">
    <h1 class="h2 fw-semibold mb-4 text-center">Checkout</h1>

    <form class="checkout-form" novalidate>
        <!-- Fieldset 1: Contact -->
        <fieldset class="mb-4 p-4 border rounded-3 bg-white">
            <legend class="float-none w-auto px-2 fs-5 fw-bold text-dark">Contact</legend>
            
            <div class="form-row mb-3">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" name="fullName" class="form-control" required placeholder="John Doe">
                    <div class="error-message">Please enter your full name.</div>
                </div>
            </div>

            <div class="form-row mb-3">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
                    <div class="error-message">Please enter a valid email address.</div>
                </div>
            </div>

            <div class="form-row mb-3">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" name="phone" class="form-control" required pattern="03[0-9]{2}-[0-9]{7}" placeholder="03XX-XXXXXXX">
                    <div class="error-message">Format must be exactly 03XX-XXXXXXX.</div>
                </div>
            </div>
        </fieldset>

        <!-- Fieldset 2: Delivery -->
        <fieldset class="mb-4 p-4 border rounded-3 bg-white">
            <legend class="float-none w-auto px-2 fs-5 fw-bold text-dark">Delivery</legend>
            
            <div class="form-row mb-3">
                <label for="address">Address</label>
                <div class="input-wrapper">
                    <input type="text" id="address" name="address" class="form-control" required placeholder="Street address, apartment, etc.">
                    <div class="error-message">Please enter your delivery address.</div>
                </div>
            </div>

            <div class="form-row mb-3">
                <label for="city">City</label>
                <div class="input-wrapper">
                    <select id="city" name="city" class="form-select" required>
                        <option value="" disabled selected>Select your city</option>
                        <option value="lahore">Lahore</option>
                        <option value="karachi">Karachi</option>
                        <option value="islamabad">Islamabad</option>
                        <option value="faisalabad">Faisalabad</option>
                        <option value="rawalpindi">Rawalpindi</option>
                    </select>
                    <div class="error-message">Please select a city.</div>
                </div>
            </div>

            <div class="form-row mb-3">
                <label for="deliveryDate">Delivery Date</label>
                <div class="input-wrapper">
                   
                    <input type="date" id="deliveryDate" name="deliveryDate" class="form-control" min="2026-10-29" max="2026-11-05" required>
                    <div class="error-message">Date must be between today and 7 days maximum.</div>
                </div>
            </div>
        </fieldset>

        
        <button type="submit" class="btn btn-dark w-100 py-3 fw-bold rounded-pill text-uppercase">Place Order</button>
    </form>
</main>

</body>
</html>
